<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gio's Fashion</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background-color: #fefefe;
      color: #222;
      line-height: 1.6;
    }

    header {
      background: #fff;
      padding: 2rem;
      text-align: center;
      border-bottom: 1px solid #ccc;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      color: #000;
      letter-spacing: 2px;
    }

    .hero {
      background-image: url('https://images.unsplash.com/photo-1520975698519-59c92f3f2962?auto=format&fit=crop&w=1950&q=80');
      background-size: cover;
      background-position: center;
      height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      text-align: center;
      padding: 2rem;
    }

    .hero h2 {
      font-size: 3rem;
      max-width: 800px;
    }

    .section {
      padding: 4rem 2rem;
      max-width: 1000px;
      margin: auto;
    }

    .section h3 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .gallery img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 2rem;
      background: #000;
      color: #fff;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Gio’s</div>
  </header>

  <section class="hero">
    <h2>Vestidos que expressam elegância, força e beleza</h2>
  </section>

  <section class="section">
    <h3>Coleções</h3>
    <div class="gallery">
      <img src="https://images.unsplash.com/photo-1584467735871-b2de61f2bc5c?auto=format&fit=crop&w=800&q=80" alt="Vestido 1">
      <img src="https://images.unsplash.com/photo-1603252109361-96a0ef0b9897?auto=format&fit=crop&w=800&q=80" alt="Vestido 2">
      <img src="https://images.unsplash.com/photo-1618220179428-22790fbc33c3?auto=format&fit=crop&w=800&q=80" alt="Vestido 3">
      <img src="https://images.unsplash.com/photo-1618354691326-c85b2d3fc03b?auto=format&fit=crop&w=800&q=80" alt="Vestido 4">
    </div>
  </section>

  <footer>
    © 2025 Gio’s - Todos os direitos reservados
  </footer>

</body>
</html>
